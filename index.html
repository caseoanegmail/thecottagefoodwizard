<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cottage Food Wizard — Sell homemade food in Minnesota</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --cream: #FAF6EE;
    --warm-white: #FFFDF7;
    --brown: #3B2A1A;
    --brown-mid: #6B4C2E;
    --brown-light: #A07850;
    --amber: #E8943A;
    --amber-light: #F5C47A;
    --amber-pale: #FDF0D8;
    --green: #2E5E3E;
    --green-light: #4A8A5D;
    --green-pale: #EAF4ED;
    --text: #2A1F12;
    --text-mid: #6B5A44;
    --text-light: #9C876A;
    --border: rgba(59, 42, 26, 0.12);
    --radius: 12px;
  }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--cream);
    color: var(--text);
    line-height: 1.6;
    min-height: 100vh;
  }

  /* ── NAV ── */
  nav {
    position: sticky; top: 0; z-index: 100;
    background: rgba(250, 246, 238, 0.92);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 0 2rem;
    display: flex; align-items: center; justify-content: space-between;
    height: 60px;
  }
  .nav-logo {
    font-family: 'Playfair Display', serif;
    font-size: 1.15rem;
    color: var(--brown);
    display: flex; align-items: center; gap: 8px;
  }
  .nav-logo-icon { font-size: 1.4rem; }
  .nav-cta {
    background: var(--amber);
    color: white;
    border: none;
    padding: 8px 20px;
    border-radius: 8px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.875rem;
    font-weight: 500;
    cursor: pointer;
    text-decoration: none;
    transition: background 0.2s;
  }
  .nav-cta:hover { background: #d4832d; }

  /* ── HERO ── */
  .hero {
    max-width: 960px;
    margin: 0 auto;
    padding: 5rem 2rem 3rem;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 4rem;
    align-items: center;
  }

  .hero-eyebrow {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--green-pale);
    color: var(--green);
    border: 1px solid rgba(46, 94, 62, 0.2);
    font-size: 0.78rem;
    font-weight: 500;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    padding: 4px 12px;
    border-radius: 20px;
    margin-bottom: 1.25rem;
  }
  .eyebrow-dot { width: 6px; height: 6px; background: var(--green-light); border-radius: 50%; }

  .hero h1 {
    font-family: 'Playfair Display', serif;
    font-size: 3rem;
    line-height: 1.15;
    color: var(--brown);
    margin-bottom: 1.25rem;
    font-weight: 700;
  }
  .hero h1 em {
    font-style: normal;
    color: var(--amber);
  }

  .hero-sub {
    font-size: 1.05rem;
    color: var(--text-mid);
    margin-bottom: 2rem;
    line-height: 1.7;
    font-weight: 300;
  }

  .hero-features {
    display: flex; flex-direction: column; gap: 10px;
  }
  .hero-feature {
    display: flex; align-items: flex-start; gap: 10px;
    font-size: 0.9rem;
    color: var(--text-mid);
  }
  .feature-check {
    width: 20px; height: 20px; min-width: 20px;
